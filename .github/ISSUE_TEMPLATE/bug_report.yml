name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Please remove personal addresses, phone numbers, and private sighting details before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Explain the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 136 on Android
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or logs only after removing private information.
